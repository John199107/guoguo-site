<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>灬果果の钪间灬 ✿</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* ===== Reset ===== */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a2e;color:#d0d0e8;min-height:100vh;overflow-x:hidden}
a{color:#7df9ff;text-decoration:none}
a:hover{text-decoration:underline;color:#ff6b9d}

/* ===== Theme Variables ===== */
:root{--pink:#ff6b9d;--cyan:#7df9ff;--purple:#c77dff;--gold:#ffd700;--dark-bg:#0a0a2e;--card-bg:rgba(15,15,40,0.85);--border-glow:rgba(255,107,157,0.4);--font-fun:'ZCOOL KuaiLe',cursive}

/* ===== Animated Background ===== */
.bg-stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bg-gradient{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 30% 20%,rgba(100,0,150,0.15) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(0,100,150,0.1) 0%,transparent 50%),linear-gradient(180deg,#0a0a2e 0%,#0f0f3a 50%,#1a0a2e 100%);z-index:0}

/* ===== Falling Petals ===== */
.petal{position:fixed;z-index:1;pointer-events:none;opacity:0.7;animation:petalFall linear infinite}
.petal-inner{width:12px;height:12px;background:var(--pink);border-radius:50% 0 50% 0;transform:rotate(45deg);box-shadow:0 0 6px rgba(255,107,157,0.5)}
@keyframes petalFall{0%{transform:translateY(-20px) rotate(0deg);opacity:0.8}100%{transform:translateY(100vh) rotate(360deg);opacity:0.2}}

/* ===== Mouse Trail Canvas ===== */
#trailCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;pointer-events:none}

/* ===== Welcome Overlay ===== */
.welcome-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;background:radial-gradient(circle,#0a0a2e,#050520);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s,visibility 0.8s}
.welcome-overlay.hidden{opacity:0;visibility:hidden}
.welcome-stars{position:absolute;width:100%;height:100%;overflow:hidden;pointer-events:none}
.welcome-star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{0%{opacity:0.3;transform:scale(1)}100%{opacity:1;transform:scale(1.5)}}
.welcome-title{font-family:var(--font-fun);font-size:2.8em;color:var(--pink);text-shadow:0 0 20px rgba(255,107,157,0.6),0 0 40px rgba(255,107,157,0.3);animation:glowText 2s infinite alternate;margin-bottom:10px}
@keyframes glowText{0%{text-shadow:0 0 20px rgba(255,107,157,0.6),0 0 40px rgba(255,107,157,0.3)}100%{text-shadow:0 0 30px rgba(125,249,255,0.6),0 0 50px rgba(125,249,255,0.3)}}
.welcome-sub{color:var(--cyan);font-size:1.1em;margin-bottom:30px;letter-spacing:2px}
.welcome-btn{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;padding:16px 40px;font-size:1.2em;border-radius:30px;cursor:pointer;font-family:var(--font-fun);box-shadow:0 0 30px rgba(255,107,157,0.5);transition:transform 0.2s,box-shadow 0.2s}
.welcome-btn:hover{transform:scale(1.08);box-shadow:0 0 50px rgba(255,107,157,0.8)}
.welcome-visitor{color:var(--cyan);font-size:0.9em;margin-top:20px}

/* ===== Navigation ===== */
.nav-bar{position:sticky;top:0;z-index:100;background:rgba(10,10,46,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-glow);display:flex;align-items:center;padding:8px 12px;gap:4px}
.nav-brand{font-family:var(--font-fun);color:var(--pink);font-size:1.3em;margin-right:16px;white-space:nowrap;cursor:pointer}
.nav-brand .diamond{color:var(--gold);font-size:0.7em}
.nav-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:8px 18px;border-radius:20px;border:1px solid transparent;background:transparent;color:#a0a0c0;cursor:pointer;font-size:0.95em;white-space:nowrap;transition:all 0.3s;font-family:var(--font-fun)}
.nav-tab:hover{color:var(--pink);border-color:var(--border-glow)}
.nav-tab.active{background:linear-gradient(135deg,rgba(255,107,157,0.3),rgba(199,125,255,0.3));color:#fff;border-color:var(--pink);box-shadow:0 0 15px rgba(255,107,157,0.3)}

/* ===== Main Layout ===== */
.main-wrap{position:relative;z-index:2;display:flex;max-width:1100px;margin:0 auto;padding:16px;gap:16px}
.sidebar{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.content-area{flex:1;min-width:0}

/* ===== Profile Card ===== */
.profile-card{background:var(--card-bg);border:1px solid var(--border-glow);border-radius:16px;padding:20px;text-align:center;box-shadow:0 0 20px rgba(255,107,157,0.2)}
.profile-avatar-wrap{position:relative;width:100px;height:100px;margin:0 auto 12px}
.profile-avatar{width:100px;height:100px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 15px rgba(255,215,0,0.4);object-fit:cover}
.yellow-diamond{position:absolute;top:-8px;right:-8px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.yellow-diamond svg{width:20px;height:20px}
.profile-name{font-family:var(--font-fun);color:var(--pink);font-size:1.4em;margin-bottom:4px}
.profile-real-name{color:var(--cyan);font-size:0.85em;margin-bottom:8px}
.profile-sig{color:var(--purple);font-size:0.9em;line-height:1.5;padding:8px;background:rgba(199,125,255,0.1);border-radius:8px;margin-bottom:12px}
.profile-level{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:8px}
.profile-level .star{color:var(--gold);font-size:0.9em}
.profile-level .star.empty{color:#555}
.profile-age{color:var(--cyan);font-size:0.85em}

/* ===== Visitor Widget ===== */
.visitor-widget{background:var(--card-bg);border:1px solid rgba(125,249,255,0.3);border-radius:16px;padding:16px;box-shadow:0 0 15px rgba(125,249,255,0.15)}
.visitor-title{font-family:var(--font-fun);color:var(--cyan);font-size:1em;margin-bottom:10px;text-align:center}
.visitor-count{text-align:center;font-size:1.8em;color:var(--gold);font-family:var(--font-fun);margin-bottom:6px}
.visitor-count span{font-size:0.5em;color:#a0a0c0}
.visitor-today{text-align:center;font-size:0.85em;color:#a0a0c0;margin-bottom:10px}
.visitor-recent{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.visitor-recent .anon{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));display:flex;align-items:center;justify-content:center;font-size:0.7em;color:#fff;box-shadow:0 0 8px rgba(255,107,157,0.3)}

/* ===== Flower Widget ===== */
.flower-widget{background:var(--card-bg);border:1px solid rgba(255,215,0,0.3);border-radius:16px;padding:16px;text-align:center;box-shadow:0 0 15px rgba(255,215,0,0.15)}
.flower-title{font-family:var(--font-fun);color:var(--gold);font-size:1em;margin-bottom:8px}
.flower-plant{height:120px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.flower-stem{width:4px;height:80px;background:linear-gradient(to top,#2d5016,#4a7c28);border-radius:2px;position:relative}
.flower-leaf{width:20px;height:14px;background:#4a7c28;border-radius:50% 0 50% 0;position:absolute;left:4px;transform:rotate(-30deg)}
.flower-leaf.right{transform:rotate(30deg);left:-20px}
.flower-bloom{width:24px;height:24px;background:radial-gradient(var(--pink),#ff9dbd);border-radius:50%;position:absolute;top:-4px;left:-10px;box-shadow:0 0 10px rgba(255,107,157,0.5)}
.flower-petals{position:absolute;top:-6px;left:-12px;width:28px;height:28px;animation:bloomSpin 6s linear infinite}
.flower-petal{width:10px;height:14px;background:var(--pink);border-radius:50%;position:absolute;top:0;left:9px;transform-origin:5px 14px}
@keyframes bloomSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.flower-info{color:var(--gold);font-size:0.85em;margin-top:8px}

/* ===== Like & Step Widget ===== */
.space-stats{background:var(--card-bg);border:1px solid var(--border-glow);border-radius:16px;padding:16px;display:flex;gap:12px;justify-content:center;box-shadow:0 0 15px rgba(255,107,157,0.15)}
.stat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform 0.2s;padding:8px;border-radius:12px}
.stat-btn:hover{transform:scale(1.1)}
.stat-btn.like-btn{color:var(--pink)}
.stat-btn.step-btn{color:var(--cyan)}
.stat-icon{font-size:1.8em}
.stat-count{font-size:1em;font-family:var(--font-fun)}
.stat-label{font-size:0.7em;color:#a0a0c0}
.stat-btn.liked .stat-icon{animation:heartPop 0.4s}
.stat-btn.stepped .stat-icon{animation:stepBounce 0.4s}
@keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes stepBounce{0%{transform:scale(1)}50%{transform:scale(1.3) translateY(-5px)}100%{transform:scale(1)}}

/* ===== Music Player ===== */
.music-player{position:fixed;bottom:0;left:0;width:100%;z-index:200;background:rgba(10,10,46,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--border-glow);display:flex;align-items:center;padding:6px 12px;gap:8px;font-size:0.85em}
.music-btn{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1em;box-shadow:0 0 10px rgba(255,107,157,0.3);transition:transform 0.2s}
.music-btn:hover{transform:scale(1.15)}
.music-info{flex:1;color:#a0a0c0;overflow:hidden;white-space:nowrap}
.music-info .song-name{color:var(--pink);animation:marquee 8s linear infinite;display:inline-block}
@keyframes marquee{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.music-progress{width:100px;height:4px;background:#333;border-radius:2px;overflow:hidden;cursor:pointer}
.music-progress-bar{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));width:0%;transition:width 0.3s}
.music-time{color:#a0a0c0;font-size:0.75em;min-width:40px}

/* ===== Content Card ===== */
.card{background:var(--card-bg);border:1px solid var(--border-glow);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 0 20px rgba(255,107,157,0.15);transition:box-shadow 0.3s}
.card:hover{box-shadow:0 0 30px rgba(255,107,157,0.3)}
.card-title{font-family:var(--font-fun);color:var(--pink);font-size:1.3em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:1.2em}

/* ===== Section Headers ===== */
.section{display:none;padding-bottom:60px}
.section.active{display:block}
.section-header{font-family:var(--font-fun);color:var(--pink);font-size:1.8em;margin-bottom:20px;text-align:center;text-shadow:0 0 20px rgba(255,107,157,0.5);animation:glowText 3s infinite alternate}

/* ===== 说说 ===== */
.shuoshuo-item{background:rgba(20,20,50,0.6);border:1px solid rgba(199,125,255,0.2);border-radius:12px;padding:14px;margin-bottom:12px;transition:border-color 0.3s}
.shuoshuo-item:hover{border-color:var(--pink)}
.shuoshuo-text{color:#d0d0e8;line-height:1.6;margin-bottom:8px;font-size:0.95em}
.shuoshuo-meta{display:flex;align-items:center;justify-content:space-between;font-size:0.8em;color:#a0a0c0}
.shuoshuo-date{color:var(--cyan)}
.shuoshuo-actions{display:flex;gap:10px;align-items:center}
.shuoshuo-like{color:var(--pink);cursor:pointer;font-size:0.9em;display:flex;align-items:center;gap:3px;transition:transform 0.2s}
.shuoshuo-like:hover{transform:scale(1.1)}
.shuoshuo-like.liked{color:#ff3366}

/* ===== 日志 ===== */
.diary-item{background:rgba(20,20,50,0.6);border:1px solid rgba(125,249,255,0.2);border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all 0.3s}
.diary-item:hover{border-color:var(--cyan);box-shadow:0 0 15px rgba(125,249,255,0.2)}
.diary-title{font-family:var(--font-fun);color:var(--cyan);font-size:1.1em;margin-bottom:6px}
.diary-excerpt{color:#b0b0c0;font-size:0.9em;line-height:1.5;margin-bottom:8px}
.diary-meta{display:flex;gap:12px;font-size:0.8em;color:#a0a0c0}
.diary-meta .views{color:var(--gold)}
.diary-full{display:none;color:#d0d0e8;line-height:1.8;font-size:0.95em;padding:12px 0;border-top:1px solid rgba(125,249,255,0.15);margin-top:8px}
.diary-item.expanded .diary-full{display:block}
.diary-item.expanded .diary-excerpt{display:none}

/* ===== 相册 ===== */
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.album-card{background:rgba(20,20,50,0.6);border:1px solid rgba(199,125,255,0.2);border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.3s}
.album-card:hover{border-color:var(--purple);box-shadow:0 0 20px rgba(199,125,255,0.3);transform:translateY(-3px)}
.album-cover{width:100%;height:150px;object-fit:cover;border-bottom:2px solid rgba(199,125,255,0.2)}
.album-info{padding:10px;text-align:center}
.album-name{font-family:var(--font-fun);color:var(--purple);font-size:1em}
.album-count{color:#a0a0c0;font-size:0.8em;margin-top:4px}

/* ===== Photo Viewer ===== */
.photo-viewer{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:10001;background:rgba(5,5,20,0.95);backdrop-filter:blur(5px);flex-direction:column;align-items:center;justify-content:center}
.photo-viewer.active{display:flex}
.photo-viewer-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,107,157,0.3);border:1px solid var(--pink);color:#fff;font-size:1.4em;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-viewer-img{max-width:85vw;max-height:70vh;border-radius:8px;box-shadow:0 0 30px rgba(255,107,157,0.3)}
.photo-viewer-desc{color:var(--cyan);font-size:0.9em;margin-top:12px}
.photo-nav{display:flex;gap:8px;margin-top:12px}
.photo-nav button{background:linear-gradient(135deg,var(--pink),var(--purple));border:none;color:#fff;padding:8px 20px;border-radius:20px;cursor:pointer;font-family:var(--font-fun)}

/* ===== 视频 ===== */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.video-card{background:rgba(20,20,50,0.6);border:1px solid rgba(199,125,255,0.2);border-radius:12px;overflow:hidden;transition:all 0.3s}
.video-card:hover{border-color:var(--purple);box-shadow:0 0 20px rgba(199,125,255,0.3)}
.video-card video{width:100%;aspect-ratio:16/9;border-radius:8px 8px 0 0;object-fit:cover;background:#000}
.video-card .video-info{padding:10px}
.video-card .video-title{font-family:var(--font-fun);color:var(--purple);font-size:0.95em}
.video-card .video-date{color:#a0a0c0;font-size:0.8em}

/* ===== 留言板 ===== */
.guestbook-form{background:var(--card-bg);border:1px solid var(--border-glow);border-radius:16px;padding:16px;margin-bottom:16px}
.guestbook-form textarea{width:100%;height:80px;background:rgba(20,20,50,0.6);border:1px solid rgba(125,249,255,0.2);border-radius:8px;color:#d0d0e8;padding:10px;font-size:0.9em;resize:vertical;font-family:inherit}
.guestbook-form textarea:focus{border-color:var(--cyan);outline:none}
.guestbook-form .form-row{display:flex;gap:8px;margin-top:8px}
.guestbook-form input{flex:1;background:rgba(20,20,50,0.6);border:1px solid rgba(125,249,255,0.2);border-radius:8px;color:#d0d0e8;padding:8px;font-size:0.9em}
.guestbook-form input:focus{border-color:var(--cyan);outline:none}
.guestbook-form button{background:linear-gradient(135deg,var(--pink),var(--purple));border:none;color:#fff;padding:8px 24px;border-radius:20px;cursor:pointer;font-family:var(--font-fun);font-size:0.9em;box-shadow:0 0 10px rgba(255,107,157,0.3)}
.guestbook-msg{background:rgba(20,20,50,0.6);border:1px solid rgba(199,125,255,0.15);border-radius:12px;padding:14px;margin-bottom:10px}
.guestbook-msg .msg-author{color:var(--cyan);font-size:0.9em;font-weight:bold}
.guestbook-msg .msg-content{color:#d0d0e8;line-height:1.6;margin:6px 0;font-size:0.95em}
.guestbook-msg .msg-time{color:#a0a0c0;font-size:0.75em}
.guestbook-msg .msg-actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.guestbook-msg .msg-like{color:var(--pink);cursor:pointer;font-size:0.85em;display:flex;align-items:center;gap:3px}

/* ===== Home Section ===== */
.home-feed{display:flex;flex-direction:column;gap:16px}
.home-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.home-photos img{width:100%;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--border-glow);cursor:pointer;transition:transform 0.2s,box-shadow 0.2s}
.home-photos img:hover{transform:scale(1.05);box-shadow:0 0 15px rgba(255,107,157,0.4)}
.home-diary-preview{margin-bottom:12px}
.home-video-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.home-video-preview video{width:100%;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:#000;cursor:pointer}

/* ===== 闪字 Effect ===== */
.flash-text{animation:flashColors 0.8s infinite}
@keyframes flashColors{0%{color:var(--pink)}25%{color:var(--cyan)}50%{color:var(--purple)}75%{color:var(--gold)}100%{color:var(--pink)}}

/* ===== Admin Link ===== */
.admin-link{position:fixed;top:8px;right:8px;z-index:300;font-size:0.7em;color:#555;background:rgba(20,20,40,0.5);padding:4px 8px;border-radius:8px;opacity:0.5;transition:opacity 0.3s}
.admin-link:hover{opacity:1;color:var(--cyan)}

/* ===== Responsive ===== */
@media(max-width:768px){
.sidebar{display:none}
.main-wrap{padding:8px}
.nav-brand{font-size:1em;margin-right:8px}
.nav-tab{padding:6px 12px;font-size:0.85em}
.section-header{font-size:1.4em}
.album-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.video-grid{grid-template-columns:1fr}
.home-photos{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.home-photos img{height:100px}
.music-progress{width:60px}
}
@media(max-width:480px){
.nav-tab{padding:5px 10px;font-size:0.8em}
.card{padding:12px}
.music-info .song-name{animation-duration:5s}
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0a2e}
::-webkit-scrollbar-thumb{background:var(--pink);border-radius:3px}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-gradient"></div>
<div class="bg-stars" id="bgStars"></div>

<!-- Mouse Trail Canvas -->
<canvas id="trailCanvas"></canvas>

<!-- Welcome Overlay -->
<div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-stars" id="welcomeStars"></div>
    <div class="welcome-title flash-text">灬果果の钪间灬</div>
    <div class="welcome-sub">✿ 歡迎來到果果の小钪間 ✿</div>
    <button class="welcome-btn" id="welcomeBtn" onclick="enterSpace(event)">点击进入果果的空间 ♡</button>
    <div style="color:#a0a0c0;font-size:0.85em;margin-top:12px;letter-spacing:1px;">点击屏幕任意处也可以进入哦 ~</div>
    <div class="welcome-visitor" id="welcomeVisitor"></div>
</div>

<!-- Audio -->
<audio id="bgmAudio" loop preload="auto">
    <source src="images/guoguo-music.mp3" type="audio/mpeg" />
</audio>

<!-- Navigation -->
<nav class="nav-bar">
    <div class="nav-brand" onclick="switchTab('home')">
        <span class="diamond">◆</span> 灬果果の钪间灬
    </div>
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('home')">主页</button>
        <button class="nav-tab" onclick="switchTab('shuoshuo')">说说</button>
        <button class="nav-tab" onclick="switchTab('diary')">日志</button>
        <button class="nav-tab" onclick="switchTab('album')">相册</button>
        <button class="nav-tab" onclick="switchTab('video')">视频</button>
        <button class="nav-tab" onclick="switchTab('guestbook')">留言板</button>
    </div>
</nav>

<!-- Main Layout -->
<div class="main-wrap">
    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Profile Card -->

/* Data Manager - GitHub Cloud + localStorage cache */
class DataManager {
    constructor() {
        this._ghSha = null;
        this._syncTimer = null;
        this._ghLoaded = false;
    }
    get(key) {
        const raw = localStorage.getItem('guoguo_' + key);
        if (raw) return JSON.parse(raw);
        return DEFAULT_DATA[key] || null;
    }
    set(key, val) {
        localStorage.setItem('guoguo_' + key, JSON.stringify(val));
        this._scheduleSync();
    }
    increment(key, field, amount = 1) {
        const data = this.get(key);
        data[field] = (data[field] || 0) + amount;
        this.set(key, data);
        return data[field];
    }
    _scheduleSync() {
        if (this._syncTimer) clearTimeout(this._syncTimer);
        this._syncTimer = setTimeout(() => this._syncToGitHub(), 2000);
    }
    async loadFromGitHub() {
        try {
            const resp = await fetch(GH_RAW_URL + '?t=' + Date.now());
            if (resp.ok) {
                const data = await resp.json();
                Object.keys(data).forEach(k => {
                    localStorage.setItem('guoguo_' + k, JSON.stringify(data[k]));
                });
                this._ghLoaded = true;
                // Refresh UI with fresh data
                if (typeof updateLikeStepDisplay === 'function') updateLikeStepDisplay();
                if (typeof updateVisitorDisplay === 'function') updateVisitorDisplay();
                if (typeof updateFlower === 'function') updateFlower();
                if (typeof renderHome === 'function') renderHome();
                console.log('✿ GitHub data loaded');
            } else if (resp.status === 404) {
                // db.json not yet created, push initial data
                this._syncToGitHub();
            }
        } catch(e) {
            console.log('GitHub load fallback to localStorage:', e);
        }
        // Get SHA for future writes
        this._getSha();
    }
    async _getSha() {
        try {
            const resp = await fetch(GH_API_URL, {
                headers: { 'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github+json' }
            });
            if (resp.ok) {
                const d = await resp.json();
                this._ghSha = d.sha;
            }
        } catch(e) {}
    }
    async _syncToGitHub() {
        const allData = {};
        const keys = ['profile', 'visitors', 'spaceLike', 'spaceStep', 'shuoshuo', 'diaries', 'albums', 'videos', 'guestbook'];
        keys.forEach(k => { allData[k] = this.get(k); });
        const content = utf8ToBase64(JSON.stringify(allData));
        // Get fresh SHA
        await this._getSha();
        const payload = {
            message: '数据同步 ' + new Date().toLocaleString('zh-CN'),
            content: content,
            branch: 'main'
        };
        if (this._ghSha) payload.sha = this._ghSha;
        try {
            const resp = await fetch(GH_API_URL, {
                method: 'PUT',
                headers: {
                    'Authorization': 'token ' + GH_TOKEN,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            if (resp.ok) {
                const result = await resp.json();
                this._ghSha = result.content.sha;
                console.log('✿ GitHub sync OK');
            } else if (resp.status === 409) {
                // SHA conflict - retry
                await this._getSha();
                payload.sha = this._ghSha;
                await fetch(GH_API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + GH_TOKEN,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
            }
        } catch(e) {
            console.log('GitHub sync error:', e);
        }
    }
}

        html += `<div class="diary-meta"><span class="views">👁 ${d.views}人看过</span><span>❤ ${d.likes}</span><span>${d.date}</span></div></div>`;
    });
    document.getElementById('diaryList').innerHTML = html;
}
function toggleDiary(el) {
    el.classList.toggle('expanded');
}

/* ===== Album ===== */
let currentAlbum = null, currentPhotoIdx = 0;
function renderAlbum() {
    const albums = DM.get('albums');
    let html = '';
    albums.forEach(a => {
        html += `<div class="album-card" onclick="openAlbum(${a.id})">`;
        html += `<img class="album-cover" src="${a.cover}" alt="${a.name}" />`;
        html += `<div class="album-info"><div class="album-name">❀ ${a.name}</div>`;
        html += `<div class="album-count">${a.count} 张照片</div></div></div>`;
    });
    document.getElementById('albumGrid').innerHTML = html;
}
function openAlbum(albumId) {
    const albums = DM.get('albums');
    currentAlbum = albums.find(a => a.id === albumId);
    currentPhotoIdx = 0;
    if (currentAlbum && currentAlbum.photos.length > 0) {
        openPhotoViewer(currentAlbum.photos[0].url, currentAlbum.photos[0].desc);
    }
}
function openPhotoViewer(url, desc) {
    document.getElementById('photoViewerImg').src = url;
    document.getElementById('photoViewerDesc').textContent = desc;
    document.getElementById('photoViewer').classList.add('active');
}
function closePhotoViewer() {
    document.getElementById('photoViewer').classList.remove('active');
    currentAlbum = null;
}
function prevPhoto() {
    if (!currentAlbum) return;
    currentPhotoIdx = Math.max(0, currentPhotoIdx - 1);
    const photo = currentAlbum.photos[currentPhotoIdx];
    document.getElementById('photoViewerImg').src = photo.url;
    document.getElementById('photoViewerDesc').textContent = photo.desc;
}
function nextPhoto() {
    if (!currentAlbum) return;
    currentPhotoIdx = Math.min(currentAlbum.photos.length - 1, currentPhotoIdx + 1);
    const photo = currentAlbum.photos[currentPhotoIdx];
    document.getElementById('photoViewerImg').src = photo.url;
    document.getElementById('photoViewerDesc').textContent = photo.desc;
}

/* ===== Video ===== */
function renderVideo() {
    const videos = DM.get('videos');
    let html = '';
    videos.forEach(v => {
        html += `<div class="video-card"><video src="${v.url}" controls preload="metadata"></video>`;
        html += `<div class="video-info"><div class="video-title">🎬 ${v.title}</div>`;
        html += `<div class="video-date">✿ ${v.date}</div></div></div>`;
    });
    document.getElementById('videoGrid').innerHTML = html;
}

/* ===== Guestbook ===== */
function renderGuestbook() {
    const msgs = DM.get('guestbook');
    let html = '';
    msgs.forEach(m => {
        html += `<div class="guestbook-msg"><div class="msg-author">✿ ${m.name}</div>`;
        html += `<div class="msg-content">${m.content}</div>`;
        html += `<div class="msg-time">${m.date}</div>`;
        html += `<div class="msg-actions"><div class="msg-like" onclick="likeGuestbook(${m.id})">❤ <span id="gb-like-${m.id}">${m.likes}</span></div></div></div>`;
    });
    document.getElementById('guestbookList').innerHTML = html;
}
function submitGuestbook() {
    const name = document.getElementById('guestbookName').value.trim() || '匿名访客';
    const content = document.getElementById('guestbookContent').value.trim();
    if (!content) return;
    const msgs = DM.get('guestbook');
    const today = new Date();
    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    msgs.unshift({ id: Date.now(), name: name, content: content, date: dateStr, likes: 0 });
    DM.set('guestbook', msgs);
    document.getElementById('guestbookName').value = '';
    document.getElementById('guestbookContent').value = '';
    renderGuestbook();
}
function likeGuestbook(id) {
    const msgs = DM.get('guestbook');
    const m = msgs.find(x => x.id === id);
    if (m) {
        m.likes++;
        DM.set('guestbook', msgs);
        const el = document.getElementById('gb-like-' + id);
        if (el) el.textContent = m.likes;
    }
}

/* ===== Music Player ===== */
const bgm = document.getElementById('bgmAudio');
let musicPlaying = false;
function toggleMusic() {
    if (musicPlaying) {
        bgm.pause();
        document.getElementById('musicToggle').textContent = '▶';
        musicPlaying = false;
    } else {
        bgm.play().then(() => {
            document.getElementById('musicToggle').textContent = '⏸';
            musicPlaying = true;
        }).catch(e => console.log('play failed:', e));
    }
}
function seekMusic(e) {
    const bar = e.currentTarget;
    const pct = e.offsetX / bar.offsetWidth;
    bgm.currentTime = pct * bgm.duration;
}
bgm.addEventListener('timeupdate', () => {
    if (bgm.duration) {
        const pct = (bgm.currentTime / bgm.duration) * 100;
        document.getElementById('musicProgress').style.width = pct + '%';
        const m = Math.floor(bgm.currentTime / 60);
        const s = Math.floor(bgm.currentTime % 60);
        document.getElementById('musicTime').textContent = `${m}:${String(s).padStart(2,'0')}`;
    }
});

/* ===== Welcome Overlay ===== */
function enterSpace(e) {
    if (e && e.stopPropagation) e.stopPropagation();
    const overlay = document.getElementById('welcomeOverlay');
    if (overlay.classList.contains('hidden')) return;
    overlay.classList.add('hidden');
    // BGM play is non-blocking - overlay hides regardless
    bgm.play().then(() => {
        musicPlaying = true;
        document.getElementById('musicToggle').textContent = '⏸';
    }).catch(() => {
        // Auto-retry after 1s, some browsers need a moment
        setTimeout(() => {
            bgm.play().then(() => {
                musicPlaying = true;
                document.getElementById('musicToggle').textContent = '⏸';
            }).catch(() => {});
        }, 1000);
    });
    // Count visitor
    DM.increment('visitors', 'total', 1);
    DM.increment('visitors', 'today', 1);
    updateVisitorDisplay();
}

/* ===== Mouse Trail ===== */
(function() {
    const canvas = document.getElementById('trailCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouseX = 0, mouseY = 0;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    document.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        particles.push({
            x: mouseX, y: mouseY,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            life: 1,
            size: 2 + Math.random() * 3,
            color: Math.random() > 0.5 ? '#ff6b9d' : '#7df9ff'
        });
        if (particles.length > 50) particles.shift();
    });

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02;
            if (p.life > 0) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        });
        particles = particles.filter(p => p.life > 0);
        requestAnimationFrame(animate);
    }
    animate();
})();
